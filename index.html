<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Wave Generator</title>
    <!-- Sound Effects -->
    <audio id="clickSound" src="assets/audio/click.wav" preload="auto"></audio>
    <audio id="loadingSound" src="assets/audio/loading.wav" preload="auto"></audio>
    <audio id="errorSound" src="assets/audio/error.wav" preload="auto"></audio>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="loading-overlay" id="loadingIndicator">
        <div class="loader">
            <svg class="circular-loader" viewBox="25 25 50 50">
                <circle class="circle-bg" cx="50" cy="50" r="20" fill="none" stroke="#fff" stroke-width="5"></circle>
                <circle class="circle" cx="50" cy="50" r="20" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="125.66" stroke-dashoffset="125.66" transform="rotate(-90 50 50)"></circle>
            </svg>
            <p class="fade-in">Generating Wave...</p>
        </div>
    </div>
    
    <div class="progress-indicator" id="progressIndicator" style="display: none;">
        <div class="progress-bar"></div>
        <p class="progress-text">Generating...</p>
    </div>
    
    <div class="completion-message" id="completionMessage" style="display: none;">
        <p>Wave generated successfully!</p>
    </div>
    
    <div class="container">
        <canvas id="waveCanvas" class="wave-animation" style="display: none;"></canvas>
        <div class="controls">
            <button id="generateBtn" class="button-fade-in button-scale">Generate Wave</button>
            <div class="volume-control">
                <span class="volume-label">Volume:</span>
                <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.7">
                <span id="volumeValue" class="volume-value">70%</span>
            </div>
            <div id="generatingIndicator" class="generating-indicator" style="display: none;">
                <div class="indicator-dot"></div>
            </div>
            <div class="button-container">
                <button class="export-btn button-fade-in button-scale" id="exportPng">Export as PNG</button>
                <button class="export-btn button-fade-in button-scale" id="exportSvg">Export as SVG</button>
                <button class="theme-btn button-fade-in button-scale" id="toggleTheme">Toggle Theme</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
    <footer class="footer">
        <p>© 2023 Sound Wave Generator. All rights reserved.</p>
        <p>Generated waves with <a href="https://github.com/yourusername/Sound_Wave_Generator" target="_blank">GitHub</a>.</p>
        <p>Interactive tool for visualizing sound waves.</p>
    </footer>
    <div class="reduced-motion-notice" id="reducedMotionNotice" style="display: none;">
        Reduced motion mode is enabled. Wave animations are disabled for better performance.
    </div>
    </body>
    </html>
</html>
