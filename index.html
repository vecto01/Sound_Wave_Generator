<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Wave Generator</title>
    <!-- Sound Effects -->
    <audio id="clickSound" src="assets/audio/click.wav" preload="auto"></audio>
    <audio id="loadingSound" src="assets/audio/loading.wav" preload="auto"></audio>
    <audio id="errorSound" src="assets/audio/error.wav" preload="auto"></audio>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
<link rel="stylesheet" href="css/styles.css">
<script src="js/script.js"></script>
</head>
<body>
    <!-- Прогресс-бар и индикатор загрузки -->
    <div id="progressContainer" class="progress-container">
        <div id="progressBar" class="progress-bar" aria-live="polite" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" style="width: 0%;"></div>
        <p id="loadingText" class="loading-text" style="display: none;">Loading...</p>
    </div>

    <div class="container">
        <div class="wave-container" aria-label="Sound wave visualization" style="overflow: visible;">
            <div id="loadingIndicator" class="loading-spinner" style="display: none;">
            </div>
            <canvas id="waveCanvas" class="wave-animation" style="width: 100%; height: auto;"></canvas>
        </div>
        
        <div class="controls">
            <div class="wave-type-selector">
                <button class="wave-type-btn button-fade-in button-scale button-icon" id="sineWave" aria-label="sine-wave">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 12h-4l-5 5v5h-4l-4-5V8L4 12h4l3 12h8l3-12z"></path>
                    </svg>
                    Sine
                </button>
                <button class="wave-type-btn button-fade-in button-scale button-icon" id="squareWave" aria-label="square-wave">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L4 4v16l8 4 8-4V4z"></path>
                    </svg>
                    Square
                </button>
            </div>
            
            <button class="generate-btn button-fade-in button-scale button-icon" id="generateBtn" aria-label="generate-wave">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 12h-4l-5 5v5h-4l-4-5V8L4 12h4l3 12h8l3-12z"></path>
                </svg>
                Generate Wave
            </button>
            
            <div class="controls-sliders">
                <div class="slider-group">
                    <label for="frequencySlider" class="label">Frequency:</label>
                    <input type="range" id="frequencySlider" class="slider" min="10" max="2000" value="440" aria-label="frequency-slider">
                    <span id="frequencyValue" class="value">440 Hz</span>
                </div>
                <div class="slider-group">
                    <label for="amplitudeSlider" class="label">Amplitude:</label>
                    <input type="range" id="amplitudeSlider" class="slider" min="0" max="1" value="0.5" aria-label="amplitude-slider">
                    <span id="amplitudeValue" class="value">50%</span>
                </div>
            </div>
        </div>
    </div>
    
    <footer class="footer">
        <div class="footer-links">
            <a href="https://github.com/vecto01/Sound_Wave_Generator" target="_blank" aria-label="github">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                    <path d="M16 7v16"></path>
                    <path d="M22 12c0-4.42-4.02-8-9-8a9.86 9.86 0 0 1-2.5 1.6c-.2.1-.5.1-.7.1"></path>
                </svg>
                GitHub</a>
            </div>
        </div>
        <p>Interactive tool for visualizing sound waves.</p>
    </footer>
    <div class="reduced-motion-notice" id="reducedMotionNotice" style="display: none;">
        Reduced motion mode is enabled. Wave animations are disabled for better performance.
    </div>
    <script src="script.js"></script>
</body>
</html>
